# GCP Cloud Run Manifest for ALIS Backend & Telemetry Ingestion Service
# Project: adaptive-learning-506305 | Region: us-central1

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: alis-backend
  namespace: adaptive-learning-506305
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: us-central1-docker.pkg.dev/adaptive-learning-506305/alis-repo/alis-app:latest
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
          env:
            - name: GCP_PROJECT_ID
              value: "adaptive-learning-506305"
            - name: GCP_REGION
              value: "us-central1"
            - name: NODE_ENV
              value: "production"
            - name: PUBSUB_TOPIC_TELEMETRY
              value: "alis-telemetry-events"
