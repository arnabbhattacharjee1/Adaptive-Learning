# GCP Cloud Run Service Specification for ALIS Backend
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: alis-backend-service
  namespace: 'default'
  labels:
    cloud.googleapis.com/location: us-west2
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/cpu-throttling: "false"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "100"
        run.googleapis.com/vpc-access-connector: projects/adaptive-learning-506305/locations/us-west2/connectors/alis-vpc-conn
    spec:
      containerConcurrency: 250
      containers:
      - image: gcr.io/adaptive-learning-506305/alis-backend:latest
        resources:
          limits:
            memory: 1Gi
            cpu: "1.0"
        env:
        - name: NODE_ENV
          value: production
        - name: GCP_PROJECT_ID
          value: adaptive-learning-506305
        - name: GCP_REGION
          value: us-west2
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: alis-jwt-secret
              key: latest
        ports:
        - containerPort: 8080
